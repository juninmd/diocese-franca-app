name: Android APK

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  push:
    branches: [main]
    paths: ['mobile/**']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Gerar projeto nativo
        run: npx expo prebuild -p android --no-install --clean
      - name: Compilar APK (release, assinado com a chave de debug)
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: diocese-franca-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
